<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIMA V4.1 GPS FIX</title><style>body{font-family:system-ui;background:#f6f8f3;margin:0;padding:16px}.card{max-width:600px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px #0001}h1{color:#2e7d32;font-size:20px}label{font-weight:700;margin-top:12px;display:block}input,textarea{width:100%;padding:10px;border:1px solid #aaa;border-radius:8px;margin-top:4px;box-sizing:border-box}button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;margin-top:12px;cursor:pointer}#btnGps{background:#1976d2;color:#fff}#btnDiag{background:#2e7d32;color:#fff}#preview{width:100%;display:none;margin-top:8px;border-radius:8px}.box{margin-top:12px;padding:12px;border-radius:10px;display:none}.ok{background:#d1e7dd}.bad{background:#f8d7da}.warn{background:#fff3cd}.small{font-size:12px;color:#555;margin-top:6px}</style></head><body><div class="card"><h1>🌱 FIMA V4.1 - GPS FIX</h1><label>📸 Photo malade</label><input type="file" id="photo" accept="image/*"><img id="preview"><div id="infoPhoto" class="small"></div><label>📝 Symptômes</label><textarea id="symp" rows="2" placeholder="taches jaunes feuilles"></textarea><label>🏘️ Village (manuel)</label><input id="village" placeholder="ex: Mont Ngafula"><div id="gpsInfo" class="small">📍 Cliquez GPS pour activer localisation</div><button id="btnGps">📍 ACTIVER GPS - CLIQUE ICI</button><input type="hidden" id="lat"><input type="hidden" id="lon"><input type="hidden" id="vReal"><button id="btnDiag">🔍 DIAGNOSTIQUER</button><div id="result" class="box"></div><canvas id="cv" style="display:none"></canvas></div><script>
let stats=null;const prev=document.getElementById('preview');const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
document.getElementById('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;prev.src=URL.createObjectURL(f);prev.style.display='block';prev.onload=()=>{cv.width=200;cv.height=200;ctx.drawImage(prev,0,0,200,200);const d=ctx.getImageData(0,0,200,200).data;let g=0,y=0,b=0;for(let i=0;i<d.length;i+=4){let r=d[i],gg=d[i+1],bb=d[i+2];if(gg>80&&gg>r+10)g++;else if(r>150&&gg>150&&bb<100)y++;else if(r>100&&gg<120&&bb<80)b++;}stats={green:(g/400).toFixed(1),yellow:(y/400).toFixed(1),brown:(b/400).toFixed(1)};document.getElementById('infoPhoto').textContent='IA voit: Vert '+stats.green+'% Jaune '+stats.yellow+'% Marron '+stats.brown+'%';}});
document.getElementById('btnGps').addEventListener('click',()=>{const info=document.getElementById('gpsInfo');info.textContent='📍 Demande autorisation...';if(!navigator.geolocation){info.textContent='GPS non supporté, mode Kinshasa';document.getElementById('lat').value='-4.32';document.getElementById('lon').value='15.31';document.getElementById('vReal').value='Kinshasa';return;}navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude.toFixed(5),lo=p.coords.longitude.toFixed(5);document.getElementById('lat').value=la;document.getElementById('lon').value=lo;info.textContent='✅ GPS OK: '+la+','+lo;document.getElementById('vReal').value='Kinshasa GPS';fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+la+'&lon='+lo).then(r=>r.json()).then(j=>{const v=j.address.village||j.address.suburb||j.address.city||'Kinshasa';document.getElementById('vReal').value=v;info.textContent='✅ GPS: '+la+','+lo+' Village: '+v;}).catch(()=>{});},e=>{info.textContent='❌ GPS refusé. Activez cadenas Chrome > Localisation > Autoriser. Mode test Kinshasa activé';document.getElementById('lat').value='-4.32';document.getElementById('lon').value='15.31';document.getElementById('vReal').value='Kinshasa';},{enableHighAccuracy:true,timeout:8000});});
document.getElementById('btnDiag').addEventListener('click',()=>{const r=document.getElementById('result');r.style.display='block';const s=document.getElementById('symp').value.toLowerCase();if(!stats){r.className='box bad';r.innerHTML='❌ Ajoutez photo d\'abord';return;}if(!s){r.className='box bad';r.innerHTML='❌ Décrivez symptômes';return;}let conf=75,msg='Photo: '+stats.green+'% vert '+stats.yellow+'% jaune';if(s.includes('jaune')&&parseFloat(stats.yellow)<1){conf=15;msg='⚠️ INCOHÉRENCE! Vous dites jaune mais IA voit '+stats.green+'% vert';}else if(s.includes('jaune')&&parseFloat(stats.yellow)>=1){conf=90;msg='✅ Jaune confirmé '+stats.yellow+'%';}const lat=document.getElementById('lat').value;const vReal=document.getElementById('vReal').value;let confV=lat?90:40;let msgV=lat?'✅ GPS: '+vReal:'⚠️ GPS non activé';let global=Math.round(conf*0.7+confV*0.3);let css=global<60?'bad':global<80?'warn':'ok';r.className='box '+css;r.innerHTML='<b>CONFIANCE '+global+'%</b><br>'+msg+'<br>'+msgV+'<br><hr><b>Diagnostic:</b> Carence Azote<br><b>Sol:</b> Ferralitique pH 5.1 INERA<br><b>Traitement:</b> Neem Bio 5$ + Purin papayer';});
</script></body></html>
