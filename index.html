<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIMA V4 - Anti-Triche IA Vision</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f8f3;margin:0;padding:16px;color:#1a2e05}
.card{max-width:600px;margin:0 auto;background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
h1{color:#2e7d32;margin:0 0 8px;font-size:22px}
.badge{display:inline-block;background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px}
label{font-weight:600;margin-top:14px;display:block;font-size:14px}
input,textarea,select{width:100%;padding:10px;border:1px solid #c5d6a0;border-radius:10px;margin-top:6px;box-sizing:border-box}
button{width:100%;padding:14px;background:#2e7d32;color:white;border:none;border-radius:12px;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}
button:disabled{background:#aaa}
#preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:10px;display:none;border:1px solid #ddd}
.result{margin-top:18px;padding:14px;border-radius:12px;display:none}
.warn{background:#fff3cd;border:1px solid #ffda6a}
.ok{background:#d1e7dd;border:1px solid #a3cfbb}
.bad{background:#f8d7da;border:1px solid #f1aeb5}
.small{font-size:12px;color:#666;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kpi{background:#f6f8f3;padding:8px;border-radius:8px;text-align:center;font-size:13px}
.kpi b{display:block;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h1>🌱 FIMA V4 - IA Vision Anti-Triche</h1>
<span class="badge">V4 • Vérifie Photo + GPS + Texte • Score Confiance</span>

<label>📸 Photo de la plante MALADE (obligatoire)</label>
<input type="file" id="photo" accept="image/*">
<img id="preview">
<div id="photoAnalysis" class="small"></div>

<label>📝 Ce que vous voyez</label>
<textarea id="symptome" rows="2" placeholder="Ex: taches jaunes sur feuilles"></textarea>

<label>🏘️ Village (écrivez)</label>
<input type="text" id="village" placeholder="Ex: Mont Ngafula">
<div class="small" id="gpsInfo">📍 GPS: en attente... Cliquez sur "Obtenir mon GPS"</div>
<button type="button" id="btnGps" style="background:#6c757d;margin-top:6px;padding:8px;font-size:13px">📍 Obtenir mon GPS réel</button>

<input type="hidden" id="realLat"><input type="hidden" id="realLon"><input type="hidden" id="realVillage">

<label>🌍 Type de sol</label>
<select id="sol">
<option value="">Je ne sais pas (FIMA va détecter via GPS)</option>
<option value="noir">Noir riche</option>
<option value="rouge">Rouge argileux</option>
<option value="sableux">Sableux jaune/blanc</option>
</select>

<button id="btnDiagnose">🔍 DIAGNOSTIQUER AVEC IA V4</button>

<div id="result" class="result"></div>
<canvas id="canvas" style="display:none"></canvas>
</div>

});
