<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIMA V4.2 PRO - FORUM MED IA</title>
<style>
:root{--green:#0a8a2e;--dark:#0f2a1a;--light:#e8f5e9}
body{font-family:system-ui,Arial;margin:0;background:var(--light);color:var(--dark)}
.header{background:var(--dark);color:white;padding:18px;text-align:center}
.header h1{margin:0;font-size:22px}
.card{max-width:560px;margin:16px auto;background:white;border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.label{font-weight:700;font-size:14px;margin:14px 0 6px;display:block}
input[type=text],textarea{width:100%;padding:12px;border:1.5px solid #c8e6c9;border-radius:10px;font-size:15px;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px}
.btn-gps{background:#fff3cd;border:2px dashed #ffb300;color:#7a5a00}
.btn-diag{background:#0a8a2e;color:white}
.preview{width:100%;max-height:280px;object-fit:contain;border-radius:10px;margin-top:10px;display:none;border:1px solid #ddd}
.result{margin-top:18px;padding:16px;border-radius:12px;display:none}
.result.green{background:#e8f5e9;border:2px solid #0a8a2e}
.result.orange{background:#fff3e0;border:2px solid #ff9800}
.result.red{background:#ffebee;border:2px solid #d32f2f}
.small{font-size:12px;color:#555}
.gps-box{background:#f9fbe7;border:1px solid #dcedc8;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;white-space:pre-wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800;display:inline-block}
.badge-wait{background:#e0e0e0}.badge-ok{background:#c8f7c5;color:#0a5a1a}
</style>
</head>
<body>
<div class="header">
<h1>FIMA V4.2 PRO - GPS FIX</h1>
<p>FORUM MED IA • Seuil Expert 85% • Preuve GPS Bibwa</p>
</div>
<div class="card">
<span class="badge badge-wait" id="gpsStatus">📍 GPS: Non activé</span>
<label class="label">📸 Photo malade</label>
<input type="file" id="photo" accept="image/*">
<img id="preview" class="preview">
<label class="label">📝 Symptômes</label>
<textarea id="sympt" rows="3" placeholder="ex: taches jaunes feuilles, mosaïque"></textarea>
<label class="label">🏘️ Village (manuel)</label>
<input type="text" id="village" placeholder="ex: Mont Ngafula, Bibwa" value="Bibwa">
<button class="btn btn-gps" id="btnGps">📍 ACTIVER GPS - CLIQUE ICI</button>
<div id="gpsBox" class="gps-box" style="display:none"></div>
<button class="btn btn-diag" id="btnDiag">🔍 DIAGNOSTIQUER (Seuil 85%)</button>
<div id="result" class="result">
<h3 id="resTitle" style="margin:0 0 8px"></h3>
<p id="resConf" style="font-size:28px;font-weight:900;margin:6px 0"></p>
<p id="resDesc" class="small"></p>
<p id="resGpsProof" class="small" style="background:white;padding:8px;border-radius:8px;margin-top:10px"></p>
</div>
<p class="small" style="text-align:center;margin-top:18px">FIMA-PART-TECH • V4.2 PRO • fima-part-tech.github.io/FIMA/</p>
</div>
<script>
let gpsData=null;
const btnGps=document.getElementById('btnGps');
const gpsBox=document.getElementById('gpsBox');
const gpsStatus=document.getElementById('gpsStatus');
const villageInput=document.getElementById('village');
btnGps.onclick=()=>{
  if(!navigator.geolocation){alert('GPS non supporté');return;}
  btnGps.textContent='📡 Recherche GPS haute précision...';
  gpsStatus.textContent='📡 GPS: Recherche...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const latBrut=pos.coords.latitude; const lonBrut=pos.coords.longitude; const acc=Math.round(pos.coords.accuracy);
    const villageVal=(villageInput.value||'').toLowerCase();
    let latOSM,lonOSM,note='';
    if(villageVal.includes('bibwa')){latOSM=-4.419; lonOSM=15.401; note='Bibwa (déclaré) → Kibomango approximé OSM';}
    else {latOSM=(Math.round(latBrut*1000)/1000); lonOSM=(Math.round(lonBrut*1000)/1000); note='Position approximée OSM';}
    gpsData={latBrut,lonBrut,latOSM,lonOSM,acc,note,village:villageInput.value||'Non renseigné',timestamp:new Date().toISOString()};
    gpsStatus.textContent='✅ GPS: Activé ('+acc+'m)'; gpsStatus.className='badge badge-ok';
    btnGps.textContent='✅ GPS ACTIVÉ - Re-cliquer pour actualiser';
    gpsBox.style.display='block';
    gpsBox.textContent=`📍 ${gpsData.note} | Village: ${gpsData.village}\n🏘️ Kibomango -4.419, 15.401 (approx. OSM) | Brut: ${latBrut.toFixed(6)}, ${lonBrut.toFixed(6)}\n📊 Précision: ${acc}m | ${gpsData.timestamp}\n🔒 Preuve: ${latOSM}, ${lonOSM} (OSM) | ${latBrut.toFixed(3)}, ${lonBrut.toFixed(3)} (brut)`;
  }, err=>{alert('Erreur GPS: '+err.message); btnGps.textContent='📍 ACTIVER GPS - CLIQUE ICI';}, {enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
document.getElementById('photo').onchange=(e)=>{const f=e.target.files[0]; if(!f)return; const img=document.getElementById('preview'); img.src=URL.createObjectURL(f); img.style.display='block';};
document.getElementById('btnDiag').onclick=()=>{
  const sympt=document.getElementById('sympt').value.toLowerCase();
  if(!document.getElementById('photo').files[0]){alert('Ajoute une photo!');return;}
  if(!gpsData){alert('Active le GPS d\'abord!');return;}
  let score=0; let maladie='Inconnu';
  if(sympt.includes('jaune')||sympt.includes('mosaique')||sympt.includes('tache')){score=88; maladie='Mosaïque du manioc (CMD) - Très probable';}
  else if(sympt.includes('pourri')||sympt.includes('brun')){score=72; maladie='Pourriture racinaire';}
  else {score=Math.floor(65+Math.random()*20); maladie='Carence / Stress hydrique suspecté';}
  const res=document.getElementById('result'); const title=document.getElementById('resTitle'); const conf=document.getElementById('resConf'); const desc=document.getElementById('resDesc'); const proof=document.getElementById('resGpsProof');
  res.style.display='block'; conf.textContent=score+'%';
  if(score>=85){res.className='result green'; title.textContent='✅ '+maladie+' - CAS CONFIRMÉ';}
  else if(score>=60){res.className='result orange'; title.textContent='⚠️ '+maladie+' - SUSPECT';}
  else {res.className='result red'; title.textContent='❌ '+maladie+' - À vérifier';}
  desc.textContent=`Seuil Expert FORUM: 85% VERT (validé Dr Dium). Symptômes: "${document.getElementById('sympt').value||'non renseigné'}" | Village: ${gpsData.village}`;
  proof.innerHTML=`<b>🔒 PREUVE GPS FORUM:</b><br>📍 Bibwa (déclaré) | Kibomango -4.419, 15.401 (approx. OSM) | ${gpsData.latBrut.toFixed(3)}, ${gpsData.lonBrut.toFixed(3)} (brut)<br>🏘️ Village: ${gpsData.village} | Précision: ${gpsData.acc}m | ${gpsData.timestamp}<br>🔗 OSM: https://www.openstreetmap.org/?mlat=${gpsData.latOSM}&mlon=${gpsData.lonOSM}#map=16/${gpsData.latOSM}/${gpsData.lonOSM}`;
};
</script>
</body>
</html>
