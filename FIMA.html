<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0d7a5f"><link rel="manifest" href="manifest.json"><title>FIMA</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f5f7f6}.header{background:#0d7a5f;color:white;padding:16px;display:flex;justify-content:space-between}.nav{display:flex;background:white;box-shadow:0 2px 8px rgba(0,0,0,.08)}.nav button{flex:1;padding:12px;border:none;background:white;font-weight:700;font-size:13px;color:#777;border-bottom:3px solid transparent}.nav button.active{color:#0d7a5f;border-bottom-color:#0d7a5f}.container{padding:12px;max-width:600px;margin:auto}.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:white;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:20px;display:block;color:#0d7a5f}input,select{width:100%;padding:11px;border:1.5px solid #e0e0e0;border-radius:10px;margin:5px 0}.btn{background:#0d7a5f;color:white;border:none;padding:12px;border-radius:10px;width:100%;font-weight:700;margin-top:8px}.list-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0}.hidden{display:none}h3{font-size:14px;margin-bottom:8px}</style></head><body>
<div class="header"><div><h1>FIMA PRO</h1><div style="font-size:11px">Business Offline • Version Crédible</div></div><span style="font-size:11px;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:10px">PRO</span></div>
<div class="nav"><button id="tabVente" class="active" onclick="switchTab('vente')">VENTE</button><button id="tabStock" onclick="switchTab('stock')">STOCK</button><button id="tabHisto" onclick="switchTab('histo')">HISTO</button><button id="tabCaisse" onclick="switchTab('caisse')">CAISSE</button></div>
<div class="container">
<div id="viewVente"><div class="stats"><div class="stat"><b id="caisseJour">0 $</b><small>AUJOURD'HUI</small></div><div class="stat"><b id="venteJour">0</b><small>VENTES</small></div></div>
<div class="card"><h3>Nouvelle Vente</h3><select id="prodSelect"></select><input type="number" id="qteVente" value="1" min="1"><input type="number" id="prixVente" placeholder="Prix"><button class="btn" onclick="vendre()">VENDRE</button><div id="msgVente"></div></div></div>
<div id="viewStock" class="hidden"><div class="card"><h3>Ajouter Produit</h3><input id="nomProd" placeholder="Nom ex: Sucre 1kg"><input id="stockProd" type="number" placeholder="Qte stock"><input id="achatProd" type="number" placeholder="Prix achat"><input id="venteProd" type="number" placeholder="Prix vente"><button class="btn" onclick="ajouterProduit()">+ AJOUTER</button></div><div class="card"><h3>Stock (<span id="countStock">0</span>)</h3><div id="listStock"></div></div></div>
<div id="viewHisto" class="hidden"><div class="card"><h3>Historique</h3><div id="listHisto"></div></div></div>
<div id="viewCaisse" class="hidden"><div class="card"><h3>Caisse</h3><b id="caisseTotal" style="font-size:24px;color:#0d7a5f">0 $</b><div id="resumeCaisse"></div></div></div>
</div>
<script>
let produits=JSON.parse(localStorage.getItem('fima_produits')||'[]');let ventes=JSON.parse(localStorage.getItem('fima_ventes')||'[]');
if(produits.length==0){produits=[{id:1,nom:"Sucre 1kg",stock:50,achat:1.2,vente:1.5},{id:2,nom:"Farine 1kg",stock:40,achat:0.8,vente:1.1}];save()}
function save(){localStorage.setItem('fima_produits',JSON.stringify(produits));localStorage.setItem('fima_ventes',JSON.stringify(ventes))}
function switchTab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('tab'+t[0].toUpperCase()+t.slice(1)).classList.add('active');['vente','stock','histo','caisse'].forEach(v=>document.getElementById('view'+v[0].toUpperCase()+v.slice(1)).classList.add('hidden'));document.getElementById('view'+t[0].toUpperCase()+t.slice(1)).classList.remove('hidden');if(t=='vente')renderVente();if(t=='stock')renderStock();if(t=='histo')renderHisto();if(t=='caisse')renderCaisse()}
function ajouterProduit(){let n=document.getElementById('nomProd').value,s=parseFloat(document.getElementById('stockProd').value),a=parseFloat(document.getElementById('achatProd').value),v=parseFloat(document.getElementById('venteProd').value);if(!n||isNaN(s))return alert('Remplis');produits.push({id:Date.now(),nom:n,stock:s,achat:a,vente:v});save();renderStock();alert('Ajouté')}
function renderStock(){document.getElementById('countStock').innerText=produits.length;document.getElementById('listStock').innerHTML=produits.map(p=>`<div class="list-item"><div><b>${p.nom}</b><br><small>${p.stock} | $${p.achat}->${p.vente}</small></div><button onclick="supprProd(${p.id})">X</button></div>`).join('');document.getElementById('prodSelect').innerHTML=produits.map(p=>`<option value="${p.id}">${p.nom} - $${p.vente}</option>`).join('');if(produits[0])document.getElementById('prixVente').value=produits[0].vente}
function supprProd(id){produits=produits.filter(p=>p.id!=id);save();renderStock()}
function renderVente(){let t=new Date().toLocaleDateString('fr-CD');let j=ventes.filter(v=>v.date.includes(t));document.getElementById('caisseJour').innerText=j.reduce((s,v)=>s+v.total,0).toFixed(2)+' $';document.getElementById('venteJour').innerText=j.length;document.getElementById('prodSelect').innerHTML=produits.map(p=>`<option value="${p.id}">${p.nom} (${p.stock}) $${p.vente}</option>`).join('')}
function vendre(){let id=parseFloat(document.getElementById('prodSelect').value),q=parseFloat(document.getElementById('qteVente').value),pr=parseFloat(document.getElementById('prixVente').value);let p=produits.find(x=>x.id==id);if(!p||p.stock<q)return alert('Stock insuffisant '+p.stock);p.stock-=q;let b=(pr-p.achat)*q;ventes.unshift({date:new Date().toLocaleString('fr-CD'),nom:p.nom,qte:q,prix:pr,total:pr*q,benef:b});save();document.getElementById('msgVente').innerHTML=`Vendu $${(pr*q).toFixed(2)} Benef $${b.toFixed(2)}`;renderVente()}
function renderHisto(){document.getElementById('listHisto').innerHTML=ventes.map(v=>`<div class="list-item"><div><b>${v.nom} x${v.qte}</b><br><small>${v.date}</small></div><b>$${v.total.toFixed(2)}</b></div>`).join('')||'Aucune vente'}
function renderCaisse(){let tot=ventes.reduce((s,v)=>s+v.total,0),ben=ventes.reduce((s,v)=>s+v.benef,0);document.getElementById('caisseTotal').innerText=tot.toFixed(2)+' $';document.getElementById('resumeCaisse').innerHTML=`Ventes: ${ventes.length}<br>Benef: $${ben.toFixed(2)}`}
renderVente();renderStock();
if('serviceWorker' in navigator){navigator.serviceWorker.register('data:text/javascript;base64,'+btoa('self.addEventListener("fetch",e=>{});'))}
</script></body></html>
